    <script>
      // Gracefully ignore disabled HMR WebSocket reconnection errors in AI Studio iframe
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
